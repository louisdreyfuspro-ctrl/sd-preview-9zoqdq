<script>window.SD_I18N_BASE='../';</script>
<script>/* the words of this page (strings-sessions.json) join the dictionary of the language before it runs.
   i18n.js sets SD_I18N_RUN, the dictionary file calls it: the setter below adds our words first. */
(function(){ let run=null;
  try{ Object.defineProperty(window,'SD_I18N_RUN',{configurable:true,get:()=>run,set:f=>{ run=function(D){
    try{ const x=new XMLHttpRequest(); x.open('GET','strings-sessions.json',false); x.send(null);
      if(x.status===200||x.status===0){ const S=JSON.parse(x.responseText); Object.keys(S).forEach(k=>{ const v=S[k]&&S[k][D.lang]; if(v&&!Object.prototype.hasOwnProperty.call(D.T,k)) D.T[k]=v; }); } }catch(e){}
    return f(D); }; }}); }catch(e){} })();</script>

<script>/* theme: the same setting as Profile > Appearance on the phone */
(function(){ let t='dark'; try{ t=localStorage.getItem('sdTheme')||'dark'; }catch(e){}
  document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t; })();</script>
