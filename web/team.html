<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.SD_I18N_BASE='../';</script>
<script>/* the strings of Profile, Settings and Team (strings-profile.json), added to the dictionary of the chosen language
   before it starts; a word already in the dictionary keeps its translation */
(function(){ var lang='en'; try{ lang=localStorage.getItem('sdLang')||'en'; }catch(e){} if(lang==='en') return;
  var S={}; try{ var x=new XMLHttpRequest(); x.open('GET','strings-profile.json',false); x.send(null); if(x.status===200||x.status===0) S=JSON.parse(x.responseText); }catch(e){}
  var run; Object.defineProperty(window,'SD_I18N_RUN',{configurable:true,get:function(){ return run; },set:function(fn){
    run=function(D){ D.T=D.T||{}; Object.keys(S).forEach(function(k){ var v=S[k]&&S[k][lang]; if(v&&!Object.prototype.hasOwnProperty.call(D.T,k)) D.T[k]=v; }); return fn(D); }; }});
})();</script>
<script src="../i18n.js?v=1026123817"></script>
<script src="../plan.js?v=1026123817"></script>
<script src="../care.js?v=1026123817"></script>
<script>/* theme: the same setting as Profile > Appearance on the phone */
(function(){ let t='dark'; try{ t=localStorage.getItem('sdTheme')||'dark'; }catch(e){}
  document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t; })();</script>
<link rel="stylesheet" href="web.css?v=1026123817">
<link rel="stylesheet" href="profile.css?v=1026123817">

<script src="data.js?v=1026123817"></script>
<script src="charts.js?v=1026123817"></script>
<script src="shell.js?v=1026123817"></script>
<title>StrydeUp · Team</title>
</head>
<body data-page="team">
<script>/* Profile, Settings and Team are on the computer: their links open these pages */
['profile','settings','team'].forEach(function(k){ if(SDW.PAGES[k]) SDW.PAGES[k].ready=true; });
SDW.mount({page:'team',title:'Team'});</script>
<script src="team.js?v=1026123817"></script>
</body>
</html>
