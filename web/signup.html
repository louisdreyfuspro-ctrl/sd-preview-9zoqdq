<script>window.SD_I18N_BASE='../';
/* the sign-up strings (web/strings-signup.json) join the language dictionary before it translates the page,
   and the page waits for them so it never shows a flash of English */
(function(){ let lang='en'; try{ lang=localStorage.getItem('sdLang')||'en'; }catch(e){}
  if(lang==='en') return;
  document.documentElement.classList.add('i18nWait');
  const done=()=>{ document.documentElement.classList.remove('i18nWait'); window.SDS_I18N_OK=true; dispatchEvent(new Event('sds-i18n')); };
  setTimeout(()=>{ if(!window.SDS_I18N_OK) done(); },1600);
  let run;
  Object.defineProperty(window,'SD_I18N_RUN',{configurable:true,get(){ return run; },set(f){
    run=function(D){ const go=()=>{ try{ f(D); }catch(e){} done(); };
      fetch('strings-signup.json',{cache:'no-cache'}).then(r=>r.json()).then(J=>{ const l=D.lang||lang;
        Object.keys(J).forEach(k=>{ const v=J[k]&&J[k][l]; if(v&&!Object.prototype.hasOwnProperty.call(D.T,k)) D.T[k]=v; }); }).catch(()=>{}).then(go); }; }});
})();</script>
<script src="../i18n.js?v=1026124412"></script>
<script>window.SD_OFFERS_ONLY=true;   /* plan.js gives this page only the plans (one source with Profile and the phone's sign-up) */</script>
<script src="../plan.js?v=1026124412"></script>
<script>/* theme: the same setting as Profile > Appearance on the phone */
(function(){ let t='dark'; try{ t=localStorage.getItem('sdTheme')||'dark'; }catch(e){}
  document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t; })();</script>
