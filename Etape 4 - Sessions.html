<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<script src="i18n.js?v=1001142513"></script>
<script src="plan.js?v=1001142513"></script>
<script src="care.js?v=1001142513"></script>
<script>/* theme: chosen in Profile > Appearance, shared by every page */
(function(){ let t='dark'; try{ t=localStorage.getItem('sdTheme')||'dark'; }catch(e){}
  const r=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;
  document.documentElement.dataset.theme=r; })();</script>



<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sessions</title>
<style>
  :root{
    --bg:#0A0C10; --card:#14181F; --card2:#1A1F28; --line:rgba(255,255,255,.07);
    --txt:#F2F5F8; --mut:#8A94A3; --dim:#5A6472;
    --blue:#3B82F6; --green:#4CC077; --orange:#F0A030; --red:#E85454; --gold:#F5B544;
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--txt);max-width:420px;margin:0 auto;padding-bottom:110px;
    user-select:none;font-variant-numeric:tabular-nums}
  .wrap{padding:0 16px}
  .ic{display:inline-block;flex:0 0 auto}
  .ic svg{display:block;width:100%;height:100%;fill:currentColor}

  /* header */
  .hd{display:flex;align-items:center;gap:12px;padding:18px 16px 6px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 78%,transparent)}
  .av{position:relative;width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:17px;color:#E9ECF1;
    background:linear-gradient(145deg,#232933,#15191F);border:1px solid rgba(255,255,255,.14)}
  .pro{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:2px 7px 2px 6px;border-radius:999px;
    background:#0E1116;border:1px solid rgba(214,200,170,.35);color:#D6C8AA;font-size:8.5px;font-weight:800;letter-spacing:1px}
  .pro .ic{width:9px;height:9px}
  .hi{flex:1;min-width:0}
  .hi .s{font-size:12.5px;color:var(--mut);font-weight:600}
  .hi .n{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:1px}
  .bell{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:#C7CFDB}
  .bell .ic{width:21px;height:21px}
  .bell b{position:absolute;top:6px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;display:grid;place-items:center;border:2px solid var(--bg)}

  /* sections */
  .sec{margin-top:24px}
  .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sh h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .pill{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;color:#8DB8FF;background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.25);border-radius:999px;padding:6px 11px;cursor:pointer}
  .pill .ic{width:14px;height:14px}
  .card{background:linear-gradient(180deg,#171C24,#12161D);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}

  /* top performers */
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .perf{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 6px 12px;border-radius:20px;background:linear-gradient(180deg,#171C24,#12161D);border:1px solid var(--line);cursor:pointer;position:relative}
  .perf .rk{position:absolute;top:10px;left:11px;font-size:11px;font-weight:900;color:var(--dim)}
  .perf svg.rg{width:82px;height:82px}
  .perf .nm{font-size:13px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .perf .rd{font-size:10.5px;color:var(--mut);margin-top:1px}
  .perf .dl{font-size:10.5px;font-weight:800;margin-top:7px;padding:3px 8px;border-radius:999px}
  .up{color:#5BE3A0;background:rgba(61,214,140,.13)} .down{color:#FF7B80;background:rgba(242,85,90,.13)} .flat{color:var(--mut);background:rgba(255,255,255,.06)}

  /* latest sessions: the app's session card, as is */
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .ses{flex:0 0 76%;scroll-snap-align:start;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
  .ses .th{position:relative;height:118px;background:radial-gradient(120% 90% at 30% 20%,#2A3A52,#10151D 70%)}
  .ses .th .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(10,12,16,.55);
    border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
  .ses .th .pl i{width:0;height:0;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
  .ses .th .du{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;background:rgba(10,12,16,.6);border-radius:8px;padding:3px 7px}
  .ses .th .kd{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;border-radius:8px;padding:3px 8px}
  .kd.show{background:rgba(245,181,68,.18);color:#FFD27A} .kd.train{background:rgba(255,255,255,.1);color:#C7CFDB}
  .ses .th .tk{position:absolute;left:12px;right:12px;bottom:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
  .ses .th .tk b{position:absolute;top:-3px;width:2px;height:9px;background:rgba(255,255,255,.55);border-radius:1px}
  .ses .bd{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .ses .bd .t{flex:1;min-width:0} .ses .bd .a{font-size:14px;font-weight:800} .ses .bd .b{font-size:11.5px;color:var(--mut);margin-top:2px}
  .ses .sc{font-size:18px;font-weight:800} .ses .sc small{font-size:10px;color:var(--mut);margin-left:1px}

  /* average performance */
  .big{display:flex;align-items:baseline;gap:10px}
  .big .v{font-size:36px;font-weight:800;letter-spacing:-1px} .big .v small{font-size:15px;color:var(--mut);margin-left:2px}
  .word{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
  .word .ic{width:13px;height:13px}
  .flt{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
  .flt button{font:inherit;font-size:12px;font-weight:700;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap;cursor:pointer}
  .flt button.on{color:#fff;background:var(--blue);border-color:var(--blue)}
  svg.ch{display:block;width:100%;margin-top:6px;touch-action:pan-y}
  .tip{font-size:11.5px;color:var(--mut);min-height:16px;margin-top:8px} .tip b{color:#fff}
  .fsheet{position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;z-index:90;background:#161B23;border-top-left-radius:22px;border-top-right-radius:22px;
    border:1px solid var(--line);padding:10px 16px 30px;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
  .fsheet.on{transform:none}
  .fsheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 12px}
  .fsheet h3{font-size:17px} .fsheet .lb{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--mut);margin:16px 0 8px}
  .fsheet .opts{display:flex;flex-wrap:wrap;gap:8px}
  .fsheet .opts button{font:inherit;font-size:13px;font-weight:700;color:#C7CFDB;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer}
  .fsheet .opts button.on{color:#fff;background:rgba(59,130,246,.2);border-color:var(--blue)}
  .fsheet .done{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .veil{position:fixed;inset:0;background:rgba(4,6,9,.62);z-index:80;display:none} .veil.on{display:block}

  /* active alerts */
  .al{display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-top:8px;cursor:pointer;position:relative;overflow:hidden}
  .al:first-child{margin-top:0}
  .al .sv{width:4px;border-radius:2px;flex:0 0 auto}
  .al .ha{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:#232A35}
  .al .t{flex:1;min-width:0} .al .a{font-size:13.5px;font-weight:800} .al .b{font-size:12px;color:#C7CFDB;margin-top:2px;line-height:1.35}
  .al .m{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--mut);font-weight:600}
  .al .m .lv{font-weight:800;border-radius:999px;padding:2px 8px}
  .al .go{align-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:0 0 auto}
  .al .go svg{width:15px;height:15px;stroke:#C7CFDB;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .page{position:fixed;inset:0;max-width:420px;margin:0 auto;z-index:70;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:40px}
  .page.on{transform:none}
  .ptop{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2}
  .ptop h1{font-size:18px;flex:1;text-align:center;margin-right:40px}
  .back{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
  .back svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .hf{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 14px}
  .hf button{flex:0 0 auto;display:flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:700;color:#C7CFDB;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer}
  .hf button.txt{padding:6px 12px}
  .hf button .c{width:24px;height:24px;border-radius:50%;background:#2B3442;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff}
  .hf button .n{font-size:10.5px;color:var(--mut)}
  .hf button.on{background:rgba(59,130,246,.2);border-color:var(--blue);color:#fff}

  /* trend analysis */
  .hsel{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
  .hb{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
  .hb .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2B3442,#1A1F28);
    border:2px solid transparent;box-shadow:0 0 0 1px var(--line);transition:all .2s}
  .hb.on{color:#fff} .hb.on .c{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
  .trk{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
  .tr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
  .tr .ic2{width:32px;height:32px;border-radius:10px;background:rgba(59,130,246,.12);display:grid;place-items:center;color:#5B9BFF}
  .tr .ic2 .ic{width:17px;height:17px}
  .tr .t{flex:1} .tr .a{font-size:13px;font-weight:700} .tr .b{font-size:11px;color:var(--mut);margin-top:1px}
  .tr svg.sp{width:70px;height:26px}
  .tr .v{font-size:15px;font-weight:800;min-width:44px;text-align:right}

  .full{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:13px;border-radius:14px;text-decoration:none;
    background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.28);color:#8DB8FF;font-size:13.5px;font-weight:800}
  .full svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .full .ic svg{fill:currentColor;stroke:none}
  .in{animation:up .55s cubic-bezier(.23,1,.32,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.in{animation:none}}

  .nav{
    position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;z-index:30;
    display:flex;background:rgba(12,15,20,.98);transform:translateZ(0);will-change:transform;-webkit-backface-visibility:hidden;
    border-top:1px solid var(--line);padding:9px 0 22px}
  .nav a{flex:1;text-align:center;color:var(--dim);font-size:10px;font-weight:600;text-decoration:none}
  .nav a.on{color:var(--blue)}
  .nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
  .nav svg.horse{stroke:none;opacity:.62}
  .nav a.on svg.horse{opacity:1}
  .nav a.plus{flex:0 0 78px;position:relative}
  .plusBtn{
    position:absolute;left:50%;top:-24px;transform:translateX(-50%);
    width:66px;height:66px;border-radius:50%;background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    border:4px solid var(--bg);
    box-shadow:0 4px 16px rgba(59,130,246,.45);
    transition:transform .2s cubic-bezier(.4,0,.2,1)}
  .plusBtn svg{width:27px;height:27px;stroke:#fff;stroke-width:2.4;
    stroke-linecap:round;fill:none;margin:0;transition:transform .25s}
  .plus.open .plusBtn svg{transform:rotate(45deg)}
  .addMenu{
    position:fixed;left:50%;transform:translateX(-50%) translateY(12px);
    bottom:104px;z-index:45;width:230px;
    background:linear-gradient(180deg,#1B212B,#151A22);
    border:1px solid var(--line);border-radius:16px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.4,0,.2,1)}
  .addMenu.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .addMenu button{
    display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
    color:var(--txt);font-family:inherit;font-size:13.5px;font-weight:600;
    padding:12px 13px;border-radius:11px;text-align:left}
  .addMenu button.rec{color:#fff}
  .addMenu button.rec::after{content:"New";margin-left:auto;font-size:10px;font-weight:800;color:#8DB8FF;background:rgba(59,130,246,.16);border-radius:999px;padding:2px 8px}
  .addMenu button:active{background:rgba(59,130,246,.15)}
  .addMenu svg{width:19px;height:19px;stroke:var(--blue);fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}


  .title{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 16px 4px}
  .title h1{font-size:28px;font-weight:800;letter-spacing:-.7px}
  .title .s{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
  .addH{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:800;color:#fff;background:var(--blue);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.35)}
  .addH svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
  /* the stable, at a glance */
  .stable{margin-top:14px;display:grid;grid-template-columns:1.05fr 1fr;gap:10px}
  .sc1{position:relative;overflow:hidden;border-radius:22px;padding:14px;background:linear-gradient(180deg,#171C24,#12161D);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .sc1 svg{width:96px;height:96px}
  .sc1 .l{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:6px}
  .sc1 .w{font-size:11px;font-weight:800;margin-top:6px;border-radius:999px;padding:3px 9px}
  .scs{display:grid;gap:10px}
  .sc2{border-radius:22px;padding:12px 13px;background:linear-gradient(180deg,#171C24,#12161D);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
  .sc2 .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mut)}
  .sc2 .k .ic{width:15px;height:15px}
  .sc2 .v{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
  .sc2 .v b{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1}
  .wk{display:flex;align-items:flex-end;gap:4px;height:26px}
  .wk i{width:7px;border-radius:3px;background:rgba(91,155,255,.35)} .wk i:last-child{background:#5B9BFF}
  .pips{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10.5px;font-weight:800}
  .pips span{display:flex;align-items:center;gap:5px} .pips i{width:7px;height:7px;border-radius:50%}
  .srch{display:flex;align-items:center;gap:9px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .srch svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;flex:0 0 auto}
  .srch input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px;user-select:text}
  .srch input::placeholder{color:var(--dim)}
  .fl{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .fl .lb{font-size:11px;font-weight:800;letter-spacing:.7px;color:var(--mut)}
  .sortB{display:flex;align-items:center;gap:5px;font:inherit;font-size:12px;font-weight:700;color:#C7CFDB;background:none;border:0;cursor:pointer;padding:4px 2px}
  .sortB svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .riders{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:2px 16px 4px}
  .riders::-webkit-scrollbar{display:none}
  .rb{flex:0 0 auto;display:flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:700;color:#C7CFDB;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px 6px 6px;cursor:pointer;transition:all .2s}
  .rb .av2{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#C7CFDB;background:#232A35}
  .rb.on .av2{background:var(--blue);color:#fff}
  .rb .cnt{font-size:11px;font-weight:800;color:var(--mut);background:rgba(255,255,255,.06);border-radius:999px;padding:1px 7px}
  .rb.on{background:rgba(59,130,246,.16);border-color:var(--blue);color:#fff} .rb.on .cnt{background:var(--blue);color:#fff}
  .hl{margin-top:14px;display:grid;gap:10px}
  .hc{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,#171C24,#12161D);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.045);transition:transform .15s}
  .hc:active{transform:scale(.985)}
  .coat{flex:0 0 auto;display:grid;place-items:center;background:var(--card2);border:1px solid rgba(255,255,255,.08)}
  .coat .ic{color:#C7CFDB}
  .hc .t{flex:1;min-width:0}
  .hc .n{font-size:16.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hc .r{display:flex;align-items:center;gap:6px;font-size:12px;color:#C7CFDB;font-weight:600;margin-top:5px;flex-wrap:wrap}
  .hc .r i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:8px;font-weight:800;color:#C7CFDB;background:#232A35}
  .alb{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px}
  .hc svg.rg{width:56px;height:56px;flex:0 0 auto}
  .hc .chev{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .empty{text-align:center;color:var(--mut);font-size:13px;padding:40px 0}
  /* horse profile */
  .page .wrap{padding-bottom:30px}

<style>

  .errCard .t{flex:1;min-width:0} .errCard .a{font-size:14px;font-weight:800} .errCard .b{font-size:11.5px;color:#FFB3B6;margin-top:3px}

  .errTag{font-size:10.5px;font-weight:800;color:#FF7B80;background:rgba(242,85,90,.15);border-radius:999px;padding:3px 9px;flex:0 0 auto}
  .errBan{display:flex;align-items:center;gap:11px;margin-top:14px;padding:12px 13px;border-radius:16px;background:rgba(242,85,90,.08);border:1px solid rgba(242,85,90,.35);cursor:pointer}

  .errS h3{font-size:18px;margin-top:4px}

const SESSION='Etape%201%20-%20Session%20Overview.html?v=1001142513';
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', DD='<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>';

/* Pro account: every horse of the stable and every rider (sample data, same horses as Home and My Horses) */
const HORSES=[
  {id:'mb', n:'Midnight Bolt', r:'John Doe',   perf:70, d:+4, lastD:0},
  {id:'qz', n:'Quintus Z',     r:'Marie S.',   perf:76, d:+2, lastD:1},
  {id:'bd', n:'Bella Donna',   r:'Lea Martin', perf:73, d:+6, lastD:3},
  {id:'sa', n:'Silver Arrow',  r:'John Doe',   perf:64, d:-3, lastD:4},
  {id:'nl', n:'Nova de Lys',   r:'Marie S.',   perf:61, d:-1, lastD:6},
];
window.SD_ALLH=HORSES.slice(); HORSES.splice(0,HORSES.length,...planHorses(window.SD_ALLH));
const RIDERS=[...new Set(HORSES.map(h=>h.r))];
const scoreCol=p=>p>=70?'#3DD68C':p>=55?'#F5A93B':'#F2555A';
const seedOf=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%233280,7);
function rng(s){ let seed=seedOf(s); return ()=>{seed=(seed*9301+49297)%233280; return seed/233280;}; }
function hist(h,n){ const rnd=rng(h.id); const out=[]; let v=h.perf-h.d*3-4+rnd()*4; for(let i=0;i<n;i++){ v+=(h.perf-v)/(n-i)+(rnd()-.5)*5; out.push(i===n-1?h.perf:Math.round(v)); } return out; }
const WHAT_T=['Course','Grid work','Jumping','Flatwork'], WHAT_S=['1.30 m','1.35 m','1.40 m','1.45 m','1.50 m'], VEN=['Lier','Opglabbeek','Valkenswaard','Chantilly'];
const TODAY=new Date(2026,8,30);
function sessionsOf(h){ const rnd=rng(h.id+'s'), n=26, sc=hist(h,n), out=[]; let day=h.lastD;
  for(let i=n-1;i>=0;i--){ const d=new Date(TODAY); d.setDate(d.getDate()-day); const show=rnd()<.35;
    out.push({h, date:d, show, what:show?WHAT_S[Math.floor(rnd()*5)]+', '+VEN[Math.floor(rnd()*4)]:WHAT_T[Math.floor(rnd()*4)], sc:sc[i], issues:Math.floor(rnd()*3)}); day+=3+Math.floor(rnd()*6); }
  return out; }
const ALL=HORSES.flatMap(sessionsOf).sort((a,b)=>b.date-a.date);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ago=d=>Math.round((TODAY-d)/864e5);
const when=d=>{ const a=ago(d); return a===0?'Today':a===1?'Yesterday':`${DAY[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const dur=s=>{ const t=s.show?70+(s.sc*7)%40:200+(s.sc*13)%220; return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };

/* the month at a glance */
const month=ALL.filter(s=>s.date.getMonth()===TODAY.getMonth());
const mAvg=Math.round(month.reduce((a,s)=>a+s.sc,0)/month.length);
document.getElementById('sub').textContent=HORSES.length===1?`${ALL.length} sessions · ${HORSES[0].n}`:`${ALL.length} sessions · ${HORSES.length} horses`;
if(window.SD_PLAN==='owner'){ const qo=document.getElementById('q'); if(qo) qo.placeholder=(window.SD_T||(x=>x))('Search a horse, a rider or a show'); }
if(HORSES.length===1){ const qi=document.getElementById('q'); if(qi) qi.placeholder=(window.SD_T||(x=>x))('Search a show'); }
document.getElementById('strip').innerHTML=`<div><span>THIS MONTH</span><b>${month.length}</b></div><div><span>AVERAGE SCORE</span><b style="color:${scoreCol(mAvg)}">${mAvg}%</b></div><div><span>SHOWS</span><b>${month.filter(s=>s.show).length}</b></div>`;

let errFixed=false;
/* retry: the failed video goes back into the analysis queue */
window.onErrRetry=()=>{ errFixed=true; draw(); };
let kind='all', horse='all', rider='all', sortBy='new', q='', shown=20;
try{ const rh=new URLSearchParams(location.hash.slice(1)).get('r'); if(rh&&HORSES.some(h=>h.r===rh)) rider=rh; }catch(e){}
const SORTS={new:'Newest first', best:'Best score', low:'Lowest score'};
function draw(){
  /* type: StrydeUp segmented control with its blue pill */
  const seg=document.getElementById('kind');
  let sl=seg.querySelector('.sSlide'); if(!sl){ sl=document.createElement('div'); sl.className='sSlide'; seg.appendChild(sl); }
  seg.querySelectorAll('button').forEach(x=>x.remove());
  seg.insertAdjacentHTML('beforeend',[['all','All'],['show','Shows'],['train','Training']].map(([k,l])=>`<button class="${k===kind?'on':''}" data-k="${k}">${l}</button>`).join(''));
  const mv=()=>{ const b=seg.querySelector('button.on'); if(b){ sl.style.left=b.offsetLeft+'px'; sl.style.width=b.offsetWidth+'px'; } }; mv(); setTimeout(mv,60);
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k; shown=20; draw(); });
  /* horse, rider, sort */
  const hN=horse==='all'?'All horses':HORSES.find(h=>h.id===horse).n;
  /* Stable Owner: riders first, then their horses */
  const OWN=window.SD_PLAN==='owner', HR=HORSES.filter(h=>rider==='all'||h.r===rider);
  document.getElementById('fbar').innerHTML=(OWN?`<button class="fb${rider!=='all'?' set':''}" id="fR">${rider==='all'?'All riders':rider}${DD}</button>`:'')+`<button class="fb${horse!=='all'?' set':''}" id="fH">${hN}${DD}</button><button class="fb" id="fS">${SORTS[sortBy]}${DD}</button>`;
  if(OWN) document.getElementById('fR').onclick=()=>openPick('Rider',[['all','All riders',`${ALL.length} sessions`],...RIDERS.map(r=>[r,r,(n=>`${n} horse${n>1?'s':''} · ${ALL.filter(s=>s.h.r===r).length} sessions`)(HORSES.filter(h=>h.r===r).length)])],rider,v=>{ rider=v; if(horse!=='all'&&v!=='all'&&HORSES.find(h=>h.id===horse).r!==v) horse='all'; });
  document.getElementById('fH').onclick=()=>openPick('Horse',[['all','All horses',`${ALL.filter(s=>rider==='all'||s.h.r===rider).length} sessions`],...HR.map(h=>[h.id,h.n,`${ALL.filter(s=>s.h===h).length} sessions`])],horse,v=>horse=v);
  document.getElementById('fS').onclick=()=>openPick('Sort by',Object.entries(SORTS).map(([k,l])=>[k,l,'']),sortBy,v=>sortBy=v);
  /* list, grouped by week while newest first */
  let L=ALL.filter(s=>(kind==='all'||(kind==='show')===s.show)&&(horse==='all'||s.h.id===horse)&&(rider==='all'||s.h.r===rider)
    &&(!q||(s.h.n+' '+s.what+' '+s.h.r).toLowerCase().includes(q)));
  if(sortBy==='best') L=[...L].sort((a,b)=>b.sc-a.sc); if(sortBy==='low') L=[...L].sort((a,b)=>a.sc-b.sc);
  const grp=s=>{ const a=ago(s.date); return a<=6?'THIS WEEK':a<=13?'LAST WEEK':(MON[s.date.getMonth()]==='Sep'?'EARLIER IN SEPTEMBER':MON[s.date.getMonth()].toUpperCase()+' '+s.date.getFullYear()); };
  let html='', g0='';
  if(kind!=='show'&&horse==='all'&&!q&&sortBy==='new'&&!errFixed&&HORSES.some(h=>h.n===ERR.horse&&(rider==='all'||h.r===rider))) html+=`<div class="grp">NEEDS YOUR ATTENTION</div><div class="errCard" id="errCard"><div class="th">${eic('danger-circle',26)}</div>
      <div class="t"><div class="a">${ERR.horse}</div><div class="b">Analysis failed · tap to see why</div><div class="c">${ERR.when} · ${ERR.kind}</div></div><span class="errTag">Failed</span></div>`;
  if(kind!=='show'&&horse==='all'&&rider==='all'&&!q&&sortBy==='new') html+=`<div class="grp">PROCESSING</div><div class="ssv proc"><div class="th"></div><div class="t"><div class="a">Quintus Z</div><div class="b">Uploaded just now · analysing the round</div><div class="bar"><b style="width:64%"></b></div></div><div class="p" style="font-size:12px;color:var(--mut)">~3 min</div></div>`;
  L.slice(0,shown).forEach(s=>{ if(sortBy==='new'){ const g=grp(s); if(g!==g0){ html+=`<div class="grp">${g}</div>`; g0=g; } }
    html+=`<a class="ssv" href="${SESSION}"><div class="th"><span class="pl"><i></i></span><span class="du">${dur(s)}</span></div>
      <div class="t"><div class="a">${s.h.n}</div><div class="b"><span class="kd ${s.show?'show':'train'}">${s.show?'Show':'Training'}</span>${s.what}</div>
        <div class="c">${when(s.date)}${s.issues?` · <i style="background:#F5B544"></i>${s.issues} to watch`:''}</div></div>
      <div class="p" style="color:${scoreCol(s.sc)}">${s.sc}<small>%</small></div></a>`; });
  if(!L.length) html+=`<div class="empty">No session matches.</div>`;
  if(L.length>shown) html+=`<button class="more" id="more">Show ${Math.min(20,L.length-shown)} more · ${L.length-shown} left</button>`;
  document.getElementById('list').innerHTML=html;
  const ec=document.getElementById('errCard'); if(ec) ec.onclick=openErr;
  const m=document.getElementById('more'); if(m) m.onclick=()=>{ shown+=20; draw(); };
}
const veil=document.getElementById('veil'), pick=document.getElementById('pick');
const closeP=()=>{ pick.classList.remove('on'); veil.classList.remove('on'); }; veil.onclick=closeP;
function openPick(t,opts,cur,set){ document.getElementById('pickT').textContent=t;
  document.getElementById('pickO').innerHTML=opts.map(([v,l,sub])=>`<button class="opt" data-v="${v}"><span>${l}${sub?`<small>${sub}</small>`:''}</span>${v===cur?CHK:''}</button>`).join('');
  document.querySelectorAll('#pickO .opt').forEach(b=>b.onclick=()=>{ set(b.dataset.v); shown=20; closeP(); draw(); });
  veil.classList.add('on'); pick.classList.add('on'); }
document.getElementById('q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); shown=20; draw(); });
draw(); addEventListener('resize',draw);

/* + and Upload: add a session or a horse */
const plusTab=document.getElementById('plusTab'), addMenu=document.getElementById('addMenu');
plusTab.onclick=e=>{e.preventDefault(); plusTab.classList.toggle('open'); addMenu.classList.toggle('on');};
document.getElementById('addS').onclick=e=>{ e.stopPropagation(); openUpload(); };
document.addEventListener('click',e=>{ if(addMenu.classList.contains('on')&&!addMenu.contains(e.target)&&!plusTab.contains(e.target)&&e.target.id!=='addS'){ addMenu.classList.remove('on'); plusTab.classList.remove('open'); } });
</script>

<script>
(function(){

  document.querySelectorAll('.qs,.fsheet,.sheet,.wrSheet').forEach(sh=>{
    if(getComputedStyle(sh).position!=='fixed') return;
    const x=document.createElement('button'); x.className='sheetX'; x.setAttribute('aria-label','Close'); x.textContent='×';
    x.onclick=e=>{ e.stopPropagation(); closeSheet(sh); }; sh.prepend(x);
    let y0=null, dy=0, t0=0;
    sh.addEventListener('touchstart',e=>{ if(sh.scrollTop>2||e.target.closest('input,.sheetX')) { y0=null; return; } y0=e.touches[0].clientY; dy=0; t0=Date.now(); },{passive:true});
    sh.addEventListener('touchmove',e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0;
      if(dy>0){ sh.style.transition='none'; sh.style.transform=`translateY(${dy}px)`; if(e.cancelable) e.preventDefault(); } },{passive:false});
    sh.addEventListener('touchend',()=>{ if(y0==null) return; sh.style.transition=''; const fast=dy/(Date.now()-t0)>.5;
      if(dy>90||(fast&&dy>30)) closeSheet(sh); else sh.style.transform=''; y0=null; });
  });
})();

    ['Aachen, Germany','Soers · CHIO Aachen'],['Hamburg, Germany','Derby-Park Klein Flottbek'],['London, United Kingdom','Olympia'],['Hickstead, United Kingdom','All England Jumping Course'],['Dublin, Ireland','RDS'],
    ['Vejer de la Frontera, Spain','Sunshine Tour · Dehesa Montenmedio'],['Oliva, Spain','Oliva Nova'],['Madrid, Spain','Club de Campo Villa de Madrid'],['Vienna, Austria','Rathausplatz'],['Monaco','Port Hercule'],
    ['Wellington, United States','Wellington International'],['Calgary, Canada','Spruce Meadows'],['Doha, Qatar','Al Shaqab']];
  let locOpen=false, locQ='';
  const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  function locList(){
    const q=norm(locQ.trim()), L=q?PLACES.filter(([c,v])=>norm(c+' '+v).includes(q)).slice(0,8):PLACES.slice(0,5);
    const row=(c,v,here)=>`<button class="locR${D.loc===c&&D.locSub===v?' on':''}" data-c="${c}" data-v="${v}">${u('map-point',17,here?'#5B9BFF':'#8A94A3')}<span><b>${c}</b><small>${v}</small></span></button>`;
    return (q?'':`<div class="locG">NEAR YOU</div>${row(HERE.c,HERE.v,true)}<div class="locG">POPULAR SHOW GROUNDS</div>`)
      +(L.length?L.map(([c,v])=>row(c,v,false)).join(''):`<div class="locE">No place found. Keep typing, or <button class="locFree" data-c="${locQ}">use “${locQ}”</button></div>`);
  }
  function wireLoc(){ document.querySelectorAll('#upLocL .locR,#upLocL .locFree').forEach(b=>b.onclick=()=>{ D.loc=b.dataset.c; D.locSub=b.dataset.v||'Added by you'; locOpen=false; step2(); wire(); }); }
  function step2(){
    const W=[['Sunny','Sunny','sun-2'],['Cloudy','Cloudy','cloud'],['Rain','Rain','cloud-rain'],['Windy','Windy','wind']];
    B.innerHTML=`<h2 class="q">Conditions</h2><div class="qs2">They explain a lot of the score. Skip if you are in a hurry.</div>
      <div class="uLab">WHERE</div><div class="auto">${u('map-point',20,'#5B9BFF')}<div class="t"><div class="a">${D.loc}</div><div class="b">${D.locSub}</div></div><button id="upLoc">${locOpen?'Close':'Change'}</button></div>
      ${locOpen?`<div class="locS"><div class="locI">${u('map-point',17,'#8A94A3')}<input id="upLocQ" placeholder="Search a city or a show ground" value="${locQ}" autocomplete="off"></div><div id="upLocL">${locList()}</div></div>`:''}
      <div style="margin-top:10px">${chips('place',[['Indoor','Indoor','home-2'],['Outdoor','Outdoor','sun-2']])}</div>
      <div class="uLab">GROUND</div>${chips('ground',['Sand','Grass','Fibre','Clay'])}
      <div class="uLab">GROUND FEELS</div>${chips('quality',['Soft','Good','Firm','Deep'])}
      ${D.place==='Outdoor'?`<div class="uLab">WEATHER <em>auto</em></div>${chips('weather',W)}`:''}`;
    document.getElementById('upLoc').onclick=()=>{ locOpen=!locOpen; locQ=''; step2(); wire(); if(locOpen) setTimeout(()=>document.getElementById('upLocQ').focus(),50); };
    const q=document.getElementById('upLocQ');
    if(q){ q.oninput=()=>{ locQ=q.value; document.getElementById('upLocL').innerHTML=locList(); wireLoc(); }; wireLoc(); }
  }
  function step3(){
    const F=['Tough','Hard','OK','Good','Great'];
    B.innerHTML=`<h2 class="q">How did it feel?</h2><div class="qs2">Your feeling next to the numbers is what makes the analysis useful.</div>
      <div class="uLab">OVERALL</div><div class="feel" data-k="feel">${F.map((f,i)=>`<button class="${D.feel===f?'on':''}" data-v="${f}" style="--f:${(i+1)/5}"><i></i>${f}</button>`).join('')}</div>
      <div class="uLab">THE HORSE WAS <em>several</em></div>${chips('tags',['Relaxed','Forward','Rushing','Stiff','Spooky','Tired','Listening'],true)}
      <div class="uLab">EQUIPMENT <em>several</em></div>${chips('gear',[...new Set(gearList().concat(D.gear))],true)}${gearPre?'<div class="gearPre">Same as last time, change it if needed</div>':''}<div class="gearAdd"><input id="upGearIn" placeholder="Add your own, e.g. Dutch gag" autocomplete="off"><button id="upGearGo">Add</button></div>
      <div class="uLab">NOTES</div><textarea class="inp" id="upNotes" placeholder="Anything to remember about this round…">${D.notes}</textarea>`;
    document.getElementById('upNotes').oninput=e=>D.notes=e.target.value;
    const gi=document.getElementById('upGearIn'), add=()=>{ const v=gi.value.trim().replace(/\s+/g,' '); if(!v) return; const L=gearList();
      if(!L.some(x=>x.toLowerCase()===v.toLowerCase())) L.push(v); try{ localStorage.setItem('sdGear',JSON.stringify(L)); }catch(e){}
      const name=L.find(x=>x.toLowerCase()===v.toLowerCase()); if(!D.gear.includes(name)) D.gear.push(name); gearPre=false; render(false); };
    document.getElementById('upGearGo').onclick=add; gi.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } };
  }
  function wire(){
    B.querySelectorAll('.chips').forEach(c=>c.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=c.dataset.k, v=b.dataset.v;
      if(c.dataset.m){ const a=D[k]; a.includes(v)?a.splice(a.indexOf(v),1):a.push(v); if(k==='gear') gearPre=false; } else D[k]=D[k]===v&&!['date','disc','place'].includes(k)?null:v;
      /* Stable Owner: the horse's usual rider comes first, it can be changed */
      if(k==='horse'&&window.SD_PLAN==='owner'&&!D.riderTouched) D.rider=({'Midnight Bolt':'John Doe','Silver Arrow':'John Doe','Quintus Z':'Marie S.','Nova de Lys':'Marie S.','Bella Donna':'Lea Martin'})[D.horse]||null;
      if(k==='rider') D.riderTouched=true;
      render(false); }));
    wireCal();
    B.querySelectorAll('.segU,.feel').forEach(c=>c.querySelectorAll('button').forEach(b=>b.onclick=()=>{ D[c.dataset.k]=b.dataset.v; render(false); }));
  }
  function render(top){
    document.querySelectorAll('#upSteps i').forEach((x,i)=>x.classList.toggle('on',i<=st));
    document.getElementById('upStepName').textContent=`STEP ${st+1} OF 4 · ${NAMES[st]}`;
    [step0,step1,step2,step3][st](); wire();
    const nx=document.getElementById('upNext'), sk=document.getElementById('upSkip'), hint=document.getElementById('upHint');
    sk.style.display=st>=2?'':'none';
    let ok=true, h='';
    if(st===0){ ok=!!D.file&&!(D.check&&D.check.some(x=>x.ok===false)); h=D.file?'':'Add a video to continue'; }
    if(st===1){ ok=!!D.horse&&(window.SD_PLAN!=='owner'||!!D.rider)&&(D.date!=='Other day'||!!D.pick)&&(D.kind!=='Show'||(D.height&&D.course)); h=!D.horse?'Pick the horse':window.SD_PLAN==='owner'&&!D.rider?'Pick the rider':(D.date==='Other day'&&!D.pick?'Pick the day in the calendar':(D.kind==='Show'&&!(D.height&&D.course)?'Pick the class height and the course':'')); }
    nx.disabled=!ok; nx.textContent=st===3?'Analyse this session':'Continue'; hint.textContent=h;
    document.getElementById('upBack').style.visibility=st?'visible':'hidden';
    if(top!==false) P.scrollTop=0;
  }
  function sent(){
    document.getElementById('upSteps').style.display='none'; document.getElementById('upStepName').textContent=''; document.getElementById('upBar').style.display='none';
    B.innerHTML=`<div class="sent"><div class="ok">${u('check-circle',38)}</div><h2>Uploading ${D.horse}'s round</h2>${D.rider?`<p style="margin-top:-4px">Ridden by ${D.rider}</p>`:''}
      <p>${D.kind==='Show'?`${D.height} · ${D.course}`:D.disc} · ${D.date==='Other day'&&D.pick?fmtDay(D.pick):D.date}.<br>You can leave this screen, we'll tell you when the analysis is ready.</p>
      <div class="barU"><b id="upProg"></b></div><p id="upPct" style="font-size:12px;margin-top:8px">0%</p></div>`;
    let p=0; const t=setInterval(()=>{ p=Math.min(100,p+4+Math.random()*9); document.getElementById('upProg').style.width=p+'%'; document.getElementById('upPct').textContent=p<100?Math.round(p)+'%':'Sent · analysing the round';
      if(p>=100){ clearInterval(t); try{ localStorage.setItem('sdGearLast',JSON.stringify(D.gear)); localStorage.setItem('sdLastFeel',JSON.stringify({horse:D.horse,when:D.date==='Other day'&&D.pick?fmtDay(D.pick):D.date,kind:D.kind,height:D.height,course:D.course,feel:D.feel,tags:D.tags,gear:D.gear,notes:D.notes,place:D.place,loc:D.loc,ground:D.ground,quality:D.quality,weather:D.place==='Outdoor'?D.weather:null})); }catch(e){}
        setTimeout(()=>{ if(typeof window.UP_DONE==='function') window.UP_DONE(D); else location.href='Etape%204%20-%20Sessions.html?v=1001142513'; },1100); } },160);
  }
  const close=()=>{ P.classList.remove('on'); };
  document.getElementById('upClose').onclick=close;
  document.getElementById('upBack').onclick=()=>{ if(st>0){ st--; render(); } };
  document.getElementById('upNext').onclick=()=>{ if(st<3){ st++; render(); } else sent(); };
  document.getElementById('upSkip').onclick=()=>{ if(st<3){ st++; render(); } else sent(); };
  document.getElementById('upFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    if(D.url) URL.revokeObjectURL(D.url);
    D.file=f; D.url=URL.createObjectURL(f); D.check=null; D.dur=null; render(false);
    const mb=f.size/1048576, v=document.createElement('video'); v.preload='metadata'; v.muted=true;
    const done=(w,h,d)=>{ if(D.check) return; const known=!!(w&&d);
      D.dur=known?`${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,'0')}`:'';
      D.check=[{ok:null,txt:'Checked during the analysis'},
        {ok:known?(Math.max(w,h)>=832&&Math.min(w,h)>=464):null,txt:known?`${w} × ${h}${Math.min(w,h)>=1080?' · perfect':''}`:''},
        {ok:known?(d>=7&&d<=180):null,txt:known?D.dur+(d<7?' · too short':d>180?' · too long, trim it to one round':''):''},
        {ok:mb<=500,txt:`${mb<10?mb.toFixed(1):Math.round(mb)} MB`+(mb>500?' · too big':'')}];
      render(false); };
    v.onloadedmetadata=()=>done(v.videoWidth,v.videoHeight,v.duration); v.onerror=()=>done(0,0,0);
    v.src=D.url; setTimeout(()=>done(0,0,0),2500); };
  /* a clip filmed with Record comes in already checked, straight to the basics */
  window.openUploadRecorded=(dur,horse)=>{ window.openUpload(); D.file={name:'Recorded with StrydeUp · '+dur,size:0}; D.dur=dur; if(horse) D.horse=horse;
    D.check=[{ok:null,txt:'1080p at 60 fps, set by StrydeUp'},{ok:true,txt:'1920 × 1080 · perfect'},{ok:true,txt:dur},{ok:true,txt:'Well under 500 MB'}]; st=1; render(); };
  window.openUploadFor=horse=>{ window.openUpload(); D.horse=horse; render(false); };
  window.openUpload=(where)=>{ reset(); st=0; document.getElementById('upSteps').style.display=''; document.getElementById('upBar').style.display='';
    render(); P.classList.add('on');
    document.querySelectorAll('.addMenu.on').forEach(m=>m.classList.remove('on')); document.querySelectorAll('.plus.open').forEach(p=>p.classList.remove('open'));
    if(where==='tips') setTimeout(()=>{ const t=document.getElementById('upTips'); t.open=true; t.scrollIntoView({behavior:'smooth',block:'start'}); },380); };
  document.querySelectorAll('.addMenu button:not(.rec)').forEach(b=>{ if(/Add a session/i.test(b.textContent)||b.textContent.includes(SD_T('Add a session'))) b.onclick=e=>{ e.stopPropagation(); openUpload(); }; });
})();
</script>

  #ahP .recap .mini img{width:100%;height:100%;object-fit:cover} #ahP .recap b{display:block;font-size:16px} #ahP .recap small{display:block;font-size:12px;color:var(--mut);margin-top:2px}

  html[data-theme="light"] #ahP .steps i{background:rgba(16,24,40,.1)} html[data-theme="light"] #ahP .steps i.on{background:var(--blue)}
  html[data-theme="light"] #ahP .lab em{background:rgba(16,24,40,.06)} html[data-theme="light"] #ahP .sug button,html[data-theme="light"] #ahP .ahPh small{color:#2563EB}
  .sdToast{position:fixed;left:50%;bottom:108px;transform:translate(-50%,20px);opacity:0;z-index:99;display:flex;align-items:center;gap:10px;background:#1B212B;color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:all .3s cubic-bezier(.32,.72,0,1);white-space:nowrap;pointer-events:none}

<div id="recP" aria-label="Record a session">
  <div class="cam"><div class="fence"></div></div>
  <div class="frame"><i></i><i></i><i></i><i></i><span>Keep the horse inside the frame</span></div>
  <div class="top"><div class="x" id="recX"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></div><b>Record a session</b></div>
  <div class="q">1080p · 60 FPS</div>
  <div class="timer"><i></i><span id="recT">0:00</span></div>
  <div class="turn"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>Hold your phone sideways</div>
  <div class="bot"><div class="hs" id="recH"></div>
    <div class="ctl"><span class="side" id="recTips">Tips</span><button class="shoot" id="recGo" aria-label="Start recording"><i></i></button><span class="side">1× </span></div></div>
  <div class="done" id="recDone"><h3 id="recDT"></h3><p id="recDP"></p><button class="use" id="recUse">Use this video</button><button class="re" id="recRe">Record again</button></div>
</div>
<div id="ahP" aria-label="Add a horse">
  <div class="aTop"><div class="aB" id="ahBk"><svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg></div><h1>Add a horse</h1><div class="aX" id="ahX"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></div></div>

</div>
<div class="sdToast" id="sdToast"></div>
<script>
(function(){
  const HORSE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21c-4.5-5-1.5-8-1.5-8c.924 2.463 4 2 4 2l1.774 1.36a.885.885 0 0 0 1.197-.23l1.327-1.602a1.034 1.034 0 0 0-.068-1.312l-1.282-1.367a4.37 4.37 0 0 1-1.116-2.313C18.17 8.5 17.5 7.5 16.887 6.908L16 6l1-3s-2.576.03-3.5 2C7.5 5.5 3 9.536 3 21"/></svg>';
  const HN=()=>window.SD_HN=window.SD_HN||['Midnight Bolt','Quintus Z','Bella Donna','Silver Arrow','Nova de Lys'];
  const toast=(html,ms)=>{ const t=document.getElementById('sdToast'); t.innerHTML=html; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms||2600); };
  const closeMenu=()=>{ document.querySelectorAll('.addMenu.on').forEach(m=>m.classList.remove('on')); document.querySelectorAll('.plus.open').forEach(p=>p.classList.remove('open')); };
  /* ---------- record ---------- */
  const R=document.getElementById('recP'); let rH=null, rT=null, rS=0;
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  function drawRH(){ document.getElementById('recH').innerHTML=HN().map(n=>`<button class="${n===rH?'on':''}">${n}</button>`).join('');
    document.querySelectorAll('#recH button').forEach(b=>b.onclick=()=>{ rH=b.textContent; drawRH(); }); }
  window.openRecord=()=>{ closeMenu(); rH=rH||HN()[0]; rS=0; clearInterval(rT); R.classList.remove('rec'); document.getElementById('recDone').classList.remove('on'); document.getElementById('recT').textContent='0:00'; drawRH(); R.classList.add('on'); };
  document.getElementById('recX').onclick=()=>{ clearInterval(rT); R.classList.remove('on','rec'); };
  document.getElementById('recGo').onclick=()=>{
    if(!R.classList.contains('rec')){ R.classList.add('rec'); rS=0; rT=setInterval(()=>{ rS++; document.getElementById('recT').textContent=fmt(rS); if(rS>=180) document.getElementById('recGo').click(); },1000); }
    else { clearInterval(rT); R.classList.remove('rec'); const d=Math.max(rS,1);
      document.getElementById('recDT').textContent=d<7?'A bit short':'Round recorded';
      document.getElementById('recDP').textContent=d<7?`${fmt(d)} · StrydeUp needs at least 7 seconds, one full round.`:`${rH} · ${fmt(d)} · 1080p at 60 fps`;
      document.getElementById('recUse').style.display=d<7?'none':''; document.getElementById('recDone').classList.add('on'); } };
  document.getElementById('recRe').onclick=()=>{ document.getElementById('recDone').classList.remove('on'); rS=0; document.getElementById('recT').textContent='0:00'; };
  document.getElementById('recUse').onclick=()=>{ R.classList.remove('on'); setTimeout(()=>openUploadRecorded(fmt(rS),rH),250); };
  document.getElementById('recTips').onclick=()=>{ R.classList.remove('on'); setTimeout(()=>openUpload('tips'),250); };
  /* ---------- add a horse: 5 short steps ---------- */
  const A=document.getElementById('ahP'); let H, as=0, ddOpen=false, inv=false;
  const BREEDS=['KWPN','Holsteiner','Selle Français','BWP','Zangersheide','Hanoverian','Oldenburg','Westphalian','Irish Sport Horse','Swiss Warmblood','Other'];
  const USERS=[{n:'Marie S.',r:'You · account owner',ini:'M'},{n:'John Doe',r:'Rider',ini:'JD'},{n:'Lea Martin',r:'Rider',ini:'LM'},{n:'Paul Girard',r:'Groom',ini:'PG'},{n:'Dr. Anne Keller',r:'Vet',ini:'AK'}];
  /* onboarding of a Pro or Premium account: one rider, so no "who is it for" step */
  const LAST=()=>window.AH_SKIP_ASSIGN?3:4;
  const CAM=`<svg viewBox="0 0 24 24"><g fill="currentColor"><path fill-rule="evenodd" d="M9.77778 21H14.2222C17.3433 21 18.9038 21 20.0248 20.2646C20.51 19.9462 20.9267 19.5371 21.251 19.0607C22 17.9601 22 16.4279 22 13.3636C22 10.2994 22 8.76721 21.251 7.6666C20.9267 7.19014 20.51 6.78104 20.0248 6.46268C19.3044 5.99013 18.4027 5.82123 17.022 5.76086C16.3631 5.76086 15.7959 5.27068 15.6667 4.63636C15.4728 3.68489 14.6219 3 13.6337 3H10.3663C9.37805 3 8.52715 3.68489 8.33333 4.63636C8.20412 5.27068 7.63685 5.76086 6.978 5.76086C5.59733 5.82123 4.69555 5.99013 3.97524 6.46268C3.48995 6.78104 3.07328 7.19014 2.74902 7.6666C2 8.76721 2 10.2994 2 13.3636C2 16.4279 2 17.9601 2.74902 19.0607C3.07328 19.5371 3.48995 19.9462 3.97524 20.2646C5.09624 21 6.65675 21 9.77778 21ZM16 13C16 15.2091 14.2091 17 12 17C9.79086 17 8 15.2091 8 13C8 10.7909 9.79086 9 12 9C14.2091 9 16 10.7909 16 13ZM18 9.25C17.5858 9.25 17.25 9.58579 17.25 10C17.25 10.4142 17.5858 10.75 18 10.75H19C19.4142 10.75 19.75 10.4142 19.75 10C19.75 9.58579 19.4142 9.25 19 9.25H18Z" clip-rule="evenodd" opacity=".5"/><path fill-rule="evenodd" d="M12 9C14.2091 9 16 10.7909 16 13C16 15.2091 14.2091 17 12 17C9.79086 17 8 15.2091 8 13C8 10.7909 9.79086 9 12 9ZM12 10.25C11.5858 10.25 11.25 10.5858 11.25 11V12.25H10C9.58579 12.25 9.25 12.5858 9.25 13C9.25 13.4142 9.58579 13.75 10 13.75H11.25V15C11.25 15.4142 11.5858 15.75 12 15.75C12.4142 15.75 12.75 15.4142 12.75 15V13.75H14C14.4142 13.75 14.75 13.4142 14.75 13C14.75 12.5858 14.4142 12.25 14 12.25H12.75V11C12.75 10.5858 12.4142 10.25 12 10.25Z" clip-rule="evenodd"/><path d="M19 9.25C19.4142 9.25 19.75 9.58579 19.75 10C19.75 10.4142 19.4142 10.75 19 10.75H18C17.5858 10.75 17.25 10.4142 17.25 10C17.25 9.58579 17.5858 9.25 18 9.25H19Z"/></g></svg>`, NM=()=>H.name.trim()||'your horse';
  const SN=['NAME & PHOTO','ABOUT · SEX, AGE, BREED','BODY & FEET','SPORT · OPTIONAL','WHO IS IT FOR'];
  const HSHOE='<path d="M19 4h1V1h-4v3s2 4 2 8s-2 7-6 7s-6-3-6-7s2-8 2-8V1H4v3h1S2 8 2 14c0 5 5 9 10 9s10-4 10-9c0-6-3-10-3-10M4 13c-.6 0-1-.4-1-1s.4-1 1-1s1 .4 1 1s-.4 1-1 1m2 6c-.6 0-1-.4-1-1s.4-1 1-1s1 .4 1 1s-.4 1-1 1m6 3c-.6 0-1-.4-1-1s.4-1 1-1s1 .4 1 1s-.4 1-1 1m6-3c-.6 0-1-.4-1-1s.4-1 1-1s1 .4 1 1s-.4 1-1 1m2-6c-.6 0-1-.4-1-1s.4-1 1-1s1 .4 1 1s-.4 1-1 1"/>';   /* horseshoe: Material Design Icons (Apache 2.0) */
  /* the four feet seen from above: front pair on top, hind pair below, a shoe where the horse is shod, a bare hoof elsewhere */
  const shoeSvg=k=>{ const f=k==='All four'||k==='Front only', h=k==='All four'||k==='Hind only';
    const foot=(x,y,on)=>on?`<g transform="translate(${x} ${y}) scale(.72)" fill="#5B9BFF">${HSHOE}</g>`:`<ellipse cx="${x+8.6}" cy="${y+9}" rx="6.4" ry="7.2" fill="none" stroke="rgba(138,148,163,.5)" stroke-width="1.4" stroke-dasharray="2.4 2.2"/>`;
    return `<svg viewBox="0 0 44 40">${foot(2,1,f)}${foot(24,1,f)}${foot(2,21,h)}${foot(24,21,h)}</svg>`; };
  let lastAs=-1;
  function steps(){
    const b=document.getElementById('ahBody'), anim=as!==lastAs?'stepIn':''; lastAs=as;
    if(as===0) b.innerHTML=`<div class="${anim}"><h2 class="q">What's your horse called?</h2><div class="qs2">A name and, if you like, a photo so you spot it at a glance.</div>
      <button class="ahPh" id="ahPh">${H.photo?`<img src="${H.photo}" alt="">`:`<span class="ic">${CAM}</span><small>Add a photo</small>`}</button>
      <div class="phL">${H.photo?'Tap to change the photo':'Optional'}</div>
      <input class="bigIn" id="ahName" placeholder="Horse name" value="${H.name}" autocomplete="off"></div>`;
    if(as===1){ const age=+H.year?2026-(+H.year):null, q=H.breed.toLowerCase(), sug=q?BREEDS.filter(x=>x.toLowerCase().includes(q)&&x.toLowerCase()!==q).slice(0,4):BREEDS.slice(0,5);
      b.innerHTML=`<div class="${anim}"><h2 class="q">About ${NM()}</h2><div class="qs2">Sex is needed, the rest helps us read the results.</div>
      <div class="lab">SEX</div><div class="sexG" data-k="sex">${[['Mare','Female'],['Gelding','Castrated male'],['Stallion','Entire male']].map(([v,s])=>`<button class="${H.sex===v?'on':''}" data-v="${v}"><b>${v}</b><span>${s}</span></button>`).join('')}</div>
      <div class="lab">BORN IN <em>optional</em></div><div class="yr"><button data-y="-1" aria-label="Earlier">−</button><div class="ahF"><input id="ahYear" inputmode="numeric" maxlength="4" placeholder="2016" value="${H.year}"></div><button data-y="1" aria-label="Later">+</button></div>
      <div class="yr" style="display:block"><div class="age" id="ahAge">${age?age+' years old':'Tap − or + or type the year'}</div></div>
      <div class="lab">BREED <em>optional</em></div><div class="ahF"><input id="ahBreed" placeholder="Studbook, e.g. KWPN" value="${H.breed}" autocomplete="off"></div>
      <div class="sug" id="ahSug">${sug.map(x=>`<button data-b="${x}">${x}</button>`).join('')}</div></div>`; }
    if(as===2) b.innerHTML=`<div class="${anim}"><h2 class="q">Body & feet</h2><div class="qs2">We use them to read stride length and jump height for ${NM()}.</div>
      <div class="two"><div><div class="lab">HEIGHT</div><div class="ahF"><input id="ahH" inputmode="numeric" maxlength="3" placeholder="168" value="${H.height}"><span class="u">cm</span></div></div>
        <div><div class="lab">WEIGHT <em>optional</em></div><div class="ahF"><input id="ahW" inputmode="numeric" maxlength="4" placeholder="580" value="${H.weight}"><span class="u">kg</span></div></div></div>
      <div class="help">Height measured at the withers, in centimetres. StrydeUp needs it to measure strides and jumps.</div>
      <div class="lab">SHOES <em>optional</em></div><div class="shoeG" data-k="shoes">${['All four','Front only','Hind only','Barefoot'].map(v=>`<button class="${H.shoes===v?'on':''}" data-v="${v}">${shoeSvg(v)}<b>${v}</b></button>`).join('')}</div></div>`;
    if(as===3) b.innerHTML=`<div class="${anim}"><h2 class="q">${NM()} in sport</h2><div class="qs2">Skip it if ${NM()} does not compete yet.</div>
      <div class="lab">COMPETING AT <em>optional</em></div><div class="chips" data-k="level">${['Young horse','1.10 m','1.20 m','1.30 m','1.40 m','1.50 m','1.60 m'].map(v=>`<button class="${H.level===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
      <div class="lab">COAT <em>optional</em></div><div class="chips" data-k="coat">${['Bay','Dark bay','Chestnut','Grey','Black','Palomino'].map(v=>`<button class="${H.coat===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
</div>`;
    if(as===4){ const u=USERS.find(x=>x.n===H.rider)||USERS[0], age=+H.year?2026-(+H.year):null;
      b.innerHTML=`<div class="${anim}"><h2 class="q">Who is ${NM()} for?</h2><div class="qs2">They see its sessions and get its alerts.</div>
      <div class="lab">ASSIGN TO</div><button class="dd" id="ahDd"><span class="av3">${u.ini}</span><span class="t"><b>${u.n}</b><small>${u.r}</small></span><svg viewBox="0 0 24 24" style="transform:rotate(${ddOpen?180:0}deg)"><path d="M7 10l5 5 5-5"/></svg></button>
      ${ddOpen?`<div class="uList">${USERS.map(x=>`<button class="uRow${x.n===u.n?' on':''}" data-n="${x.n}"><span class="av3">${x.ini}</span><span class="t"><b>${x.n}</b><small>${x.r}</small></span>${x.n===u.n?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</button>`).join('')}
        <button class="uRow inv" id="ahInv"><span class="av3">+</span><span class="t"><b>Invite someone</b><small>By email</small></span></button></div>`:''}
      ${inv?`<div class="lab">INVITE BY EMAIL</div><div class="ahF"><input id="ahEm" type="email" placeholder="name@stable.com" value="${H.email||''}" autocomplete="off"></div>`:''}
      <div class="recap"><span class="mini">${H.photo?`<img src="${H.photo}" alt="">`:`<span style="width:26px;height:26px;display:block">${HORSE_SVG}</span>`}</span><span><b>${H.name.trim()}</b>
        <small>${[H.sex,age?age+' years':null,H.breed||null,+H.height?H.height+' cm':null,H.shoes||null,H.level||null].filter(Boolean).join(' · ')}</small></span></div></div>`; }
    wireAH(); bar();
  }
  function wireAH(){
    const bind=(id,k,after)=>{ const e=document.getElementById(id); if(e) e.oninput=()=>{ H[k]=e.value; if(after) after(); bar(); }; };
    bind('ahName','name'); bind('ahH','height'); bind('ahW','weight'); bind('ahFei','fei'); bind('ahEm','email');
    bind('ahYear','year',()=>{ const a=+H.year?2026-(+H.year):null; document.getElementById('ahAge').textContent=a&&a>0&&a<40?a+' years old':'Tap − or + or type the year'; });
    bind('ahBreed','breed',()=>drawSug());
    const ph=document.getElementById('ahPh'); if(ph) ph.onclick=()=>document.getElementById('ahPhoto').click();
    document.querySelectorAll('#ahBody [data-k]').forEach(c=>c.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{ const k=c.dataset.k; H[k]=H[k]===b.dataset.v&&k!=='sex'?null:b.dataset.v; steps(); }));
    document.querySelectorAll('#ahBody .yr > button').forEach(b=>b.onclick=()=>{ const y=(+H.year||2016)+ +b.dataset.y; if(y>=1996&&y<=2025){ H.year=String(y); document.getElementById('ahYear').value=H.year; document.getElementById('ahAge').textContent=(2026-y)+' years old'; bar(); } });
    wireSug();
    const dd=document.getElementById('ahDd'); if(dd) dd.onclick=()=>{ ddOpen=!ddOpen; steps(); };
    document.querySelectorAll('.uRow[data-n]').forEach(b=>b.onclick=()=>{ H.rider=b.dataset.n; ddOpen=false; inv=false; steps(); });
    const iv=document.getElementById('ahInv'); if(iv) iv.onclick=()=>{ inv=true; ddOpen=false; steps(); setTimeout(()=>document.getElementById('ahEm').focus(),50); };
  }
  function drawSug(){ const e=document.getElementById('ahSug'); if(!e) return; const q=H.breed.toLowerCase(), sug=q?BREEDS.filter(x=>x.toLowerCase().includes(q)&&x.toLowerCase()!==q).slice(0,4):BREEDS.slice(0,5);
    e.innerHTML=sug.map(x=>`<button data-b="${x}">${x}</button>`).join(''); wireSug(); }
  function wireSug(){ document.querySelectorAll('#ahSug button').forEach(b=>b.onclick=()=>{ H.breed=b.dataset.b; document.getElementById('ahBreed').value=H.breed; drawSug(); }); }
  function bar(){
    document.querySelectorAll('#ahSteps i').forEach((x,i)=>x.classList.toggle('on',i<=as));
    document.getElementById('ahSN').textContent=`STEP ${as+1} OF ${LAST()+1} · ${SN[as]}`;
    document.getElementById('ahBk').style.visibility=as?'visible':'hidden';
    const nx=document.getElementById('ahSave'), sk=document.getElementById('ahSkip'); sk.style.display=as===3?'':'none';
    let ok=true,h=''; if(as===0){ ok=!!H.name.trim(); h=ok?'':'Give the horse a name'; } if(as===1){ ok=!!H.sex; h=ok?'':'Pick mare, gelding or stallion'; }
    if(as===2){ const hh=+H.height; ok=hh>=120&&hh<=200; h=ok?'':(H.height?'Height between 120 and 200 cm':'Add the height at the withers'); }
    nx.disabled=!ok; nx.textContent=as===LAST()?`Add ${H.name.trim()}`:'Continue'; document.getElementById('ahHint').textContent=h;
    document.querySelectorAll('#ahSteps i').forEach((x,i)=>x.style.display=i>LAST()?'none':'');
  }
  const go=d=>{ as=Math.max(0,Math.min(LAST(),as+d)); ddOpen=false; A.scrollTop=0; steps(); if(as===0) setTimeout(()=>{ const n=document.getElementById('ahName'); if(n&&!H.name) n.focus(); },50); };
  document.getElementById('ahPhoto').onchange=e=>{ const f=e.target.files[0]; if(!f) return; H.photo=URL.createObjectURL(f); steps(); };
  window.openAddHorse=()=>{ closeMenu(); as=0; lastAs=-1; ddOpen=false; inv=false; H={name:'',breed:'',year:'',sex:null,coat:null,level:null,fei:'',photo:null,height:'',weight:'',shoes:null,rider:USERS[0].n,email:''};
    steps(); A.scrollTop=0; A.classList.add('on'); setTimeout(()=>document.getElementById('ahName').focus(),400); };
  document.getElementById('ahX').onclick=()=>A.classList.remove('on');
  document.getElementById('ahBk').onclick=()=>go(-1);
  document.getElementById('ahSkip').onclick=()=>go(1);
  function finish(){ const n=H.name.trim(); const who=inv&&H.email&&H.email.trim()?H.email.trim():H.rider;
    HN().push(n); A.classList.remove('on');
    if(typeof window.onHorseAdded==='function') window.onHorseAdded({...H,name:n,rider:who});
    toast(`${n} added${who!==USERS[0].n?` for ${who}`:''} · <a href="#" id="tFirst">Add its first session</a>`,4200);
    setTimeout(()=>{ const f=document.getElementById('tFirst'); if(f) f.onclick=e=>{ e.preventDefault(); document.getElementById('sdToast').classList.remove('on'); openUploadFor(n); }; },50); }
  document.getElementById('ahSave').onclick=()=>{ if(as<LAST()) go(1); else finish(); };
  /* ---------- wire the + menu of this page ---------- */
  document.querySelectorAll('.addMenu').forEach(m=>m.querySelectorAll('button').forEach(b=>{
    if(b.classList.contains('rec')) b.onclick=e=>{ e.stopPropagation(); openRecord(); };
    else if(/Add a horse/i.test(b.textContent)||b.textContent.includes(SD_T('Add a horse'))) b.onclick=e=>{ e.stopPropagation(); openAddHorse(); };
    else if(/Add a session/i.test(b.textContent)||b.textContent.includes(SD_T('Add a session'))) b.onclick=e=>{ e.stopPropagation(); openUpload(); }; }));
})();
</script>

<script>
/* ---------- professionals: this tab is Care, the calendar of every visit on the horses they follow ---------- */
(function(){ if(!window.SD_STAFF||!window.CARE) return;
  const plan=SD_PLAN, T=window.SD_T||(x=>x), $=id=>document.getElementById(id), DAY=864e5, TD=new Date(2026,8,30);
  const N={mb:'Midnight Bolt',qz:'Quintus Z',bd:'Bella Donna',sa:'Silver Arrow',nl:'Nova de Lys'}, ids=SD_FOLLOW();
  const types=plan==='vet'?['vet']:plan==='farrier'?['farrier']:null;
  const PN={vet:'Vet',osteo:'Osteopath',farrier:'Farrier',dentist:'Dentist',physio:'Physio',chiro:'Chiropractor',saddle:'Saddle fitter',nutri:'Nutritionist',other:'Other'};
  const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const fmt=d=>d.toLocaleDateString(window.SD_LANG||'en',{weekday:'short',day:'numeric',month:'short'});
  const ago=d=>{ const n=Math.round((TD-d)/DAY); return n<0?`${T('In')} ${-n} ${T('days')}`:n===0?T('Today'):n===1?T('Yesterday'):`${n} ${T('days ago')}`; };
  document.querySelector('.title h1').textContent=T('Care');
  $('sub').textContent=`${SD_STABLE} · ${ids.length} ${T(ids.length===1?'horse':'horses')}`;
  const add=$('addS'); add.innerHTML=`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${T(plan==='farrier'?'Log a shoeing':plan==='vet'?'Add a visit':'Log a care')}`;
  add.onclick=e=>{ e.preventDefault(); e.stopImmediatePropagation(); openStaffLog(); };
  document.querySelector('.wrap').insertAdjacentHTML('beforebegin','<div class="wrap" id="careAll"></div>');
  [...document.querySelectorAll('.wrap')].forEach(w=>{ if(w.id!=='careAll') w.style.display='none'; });
  let calM=new Date(TD.getFullYear(),TD.getMonth(),1), pick=null;
  const draw=()=>{ const V=ids.flatMap(id=>CARE.list(id).filter(v=>!types||types.includes(v.type)).map(v=>({...v,hid:id,hn:N[id]}))).sort((a,b)=>a.d-b.d);
    const y=calM.getFullYear(), mo=calM.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, n=new Date(y,mo+1,0).getDate();
    const on=d=>V.filter(v=>v.d.getFullYear()===y&&v.d.getMonth()===mo&&v.d.getDate()===d);
    let cells=''; for(let i=0;i<first;i++) cells+='<span></span>';
    for(let d=1;d<=n;d++){ const vs=on(d), td=y===TD.getFullYear()&&mo===TD.getMonth()&&d===TD.getDate(), k=`${y}-${mo}-${d}`;
      cells+=`<button class="${vs.length?'has':''}${td?' td':''}${pick===k?' on':''}${new Date(y,mo,d)>TD?' fut':''}" data-d="${d}">${d}${vs.length?`<i>${vs.slice(0,2).map(v=>CARE.ico(v.type,10,'currentColor')).join('')}</i>`:''}</button>`; }
    const inMonth=V.filter(v=>v.d.getFullYear()===y&&v.d.getMonth()===mo), shown=pick?inMonth.filter(v=>`${y}-${mo}-${v.d.getDate()}`===pick):inMonth;
    const upAll=V.filter(v=>v.d>TD);
    const item=v=>{ const planned=v.d>TD; return `<a class="cvIt${planned?' plan':''}" href="Etape%203%20-%20My%20Horses.html?v=1001142513#h=${v.hid}" style="text-decoration:none;color:inherit"><span class="nd">${CARE.ico(v.type,17,planned?'#8DB8FF':'#fff')}</span>
      <div class="t"><div class="a">${v.hn}${plan==='groom'?` <span>· ${T(PN[v.type])}</span>`:''}</div><div class="b">${fmt(v.d)} · ${ago(v.d)}${v.who?' · '+v.who:''}${v.note?' · '+v.note:''}</div></div>${planned?`<span class="cvPl">${T('Planned')}</span>`:''}</a>`; };
    $('careAll').innerHTML=`<div class="card" style="margin-top:14px"><div class="lhead"><h2>${T('Coming up')}</h2><span class="flN" style="font-size:12px;font-weight:800;color:var(--mut)">${upAll.length}</span></div>
        ${upAll.length?upAll.map(item).join(''):`<div class="cvEmpty">${T('Nothing planned.')}</div>`}</div>
      <div class="card" style="margin-top:14px"><div class="cvCal" style="margin-top:0;border:0;background:none;padding:0"><div class="cvCalH"><button data-c="-1" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg></button><b>${T(MONL[mo])} ${y}</b><button data-c="1" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
        <div class="cvW">${Array.from({length:7},(_,i)=>new Date(2026,0,5+i).toLocaleDateString(window.SD_LANG||'en',{weekday:'narrow'})).map(x=>`<span>${x}</span>`).join('')}</div><div class="cvG">${cells}</div></div>
        <div class="cvMo">${pick?fmt(new Date(y,mo,+pick.split('-')[2])).toUpperCase():T(MONL[mo]).toUpperCase()+' '+y}</div>
        ${shown.length?[...shown].reverse().map(item).join(''):`<div class="cvEmpty">${T(pick?'No visit this day.':'No visit this month.')}</div>`}</div>`;
    $('careAll').querySelectorAll('.cvCalH button').forEach(b=>b.onclick=()=>{ calM=new Date(y,mo+ +b.dataset.c,1); pick=null; draw(); });
    $('careAll').querySelectorAll('.cvG button').forEach(b=>b.onclick=()=>{ const k=`${y}-${mo}-${b.dataset.d}`; pick=pick===k?null:k; draw(); }); };
  window.SD_onCare=draw; draw();
})();
</script>
<script>/* percentages in rings: the number sits in the exact centre, the % hangs on its right (measured, not guessed) */
(function(){ const fix=()=>document.querySelectorAll('svg text[text-anchor="middle"]').forEach(t=>{
    const p=[...t.querySelectorAll('tspan')].find(x=>x.textContent.trim()==='%'); if(!p||!t.getComputedTextLength) return;
    if(t.dataset.cx==null) t.dataset.cx=t.getAttribute('x'); const cx=parseFloat(t.dataset.cx); if(isNaN(cx)) return;
    let w=0; try{ w=p.getComputedTextLength()+(parseFloat(p.getAttribute('dx'))||0); }catch(e){ return; }
    if(w>0) t.setAttribute('x',(cx+w/2).toFixed(2)); });
  let q=0; const later=()=>{ if(q) return; q=requestAnimationFrame(()=>{ q=0; fix(); }); };
  new MutationObserver(later).observe(document.body,{childList:true,subtree:true});
  addEventListener('load',later); if(document.fonts) document.fonts.ready.then(later); later(); })();</script>
